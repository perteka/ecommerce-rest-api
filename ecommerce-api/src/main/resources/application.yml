spring:
  application:
    name: ecommerce-api
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    web:
      pageable:
        max-page-size: 100
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

security:
  jwt:
    issuer: ${JWT_ISSUER:ecommerce-api}
    expiration: ${JWT_EXPIRATION:PT15M}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:P7D}
    absolute-refresh-expiration: ${JWT_ABSOLUTE_REFRESH_EXPIRATION:P30D}
    max-sessions-per-user: ${JWT_MAX_SESSIONS_PER_USER:5}
    revoked-token-retention: ${JWT_REVOKED_TOKEN_RETENTION:P7D}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    auth-max-requests: ${RATE_LIMIT_AUTH_MAX_REQUESTS:10}
    auth-window: ${RATE_LIMIT_AUTH_WINDOW:PT1M}

logging:
  level:
    root: INFO
